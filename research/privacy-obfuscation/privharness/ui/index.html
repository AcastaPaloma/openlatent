<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>privharness</title>
<style>
:root {
  --paper: oklch(97% .002 250); --paper-2: oklch(93.5% .003 250); --rule: oklch(86% .004 250);
  --ink: oklch(21% .008 260); --ink-2: oklch(42% .008 260); --ink-3: oklch(52% .008 260);
  --film: oklch(15% .004 60); --film-2: oklch(24% .005 60); --edge: oklch(82% .13 78);
  --grease: oklch(54% .205 28); --grease-dark: oklch(46% .18 28); --wax: oklch(86% .16 95); --wax-ink: oklch(45% .09 90);
  --fail: oklch(45% .16 25); --fail-bg: oklch(95% .02 25);
  --sans: "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
::selection { background: var(--grease); color: #fff; }
body { caret-color: var(--grease); margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
h1, h2, h3, p { margin: 0; text-wrap: pretty; }
h1, h2 { text-wrap: balance; }
h1 { font-size: 1.75rem; line-height: 1.2; font-weight: 600; letter-spacing: -.02em; }
h2 { font-size: 1.15rem; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; }
h3 { font-size: .95rem; font-weight: 600; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); font-size: .92em; font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-2); }
.small { font-size: .87rem; }
.measure { max-width: 68ch; }
:focus-visible { outline: 2px solid var(--grease); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 22px; padding: 12px 24px; border-bottom: 1px solid var(--rule); }
.brand { font-weight: 600; letter-spacing: -.01em; text-decoration: none; }
.top nav { display: flex; gap: 18px; flex: 1; }
.top nav a { text-decoration: none; color: var(--ink-2); padding: 4px 0; border-bottom: 2px solid transparent; }
.top nav a:hover { color: var(--ink); }
.top nav a[aria-current=page] { color: var(--ink); border-bottom-color: var(--ink); }
main { padding: 28px 24px 72px; max-width: 1360px; margin: 0 auto; }

.btn { white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 6px 14px; border: 1px solid var(--ink-3); border-radius: 3px; background: transparent; cursor: pointer; text-decoration: none; transition: background .15s, color .15s, border-color .15s; }
.btn:hover:not(:disabled) { background: var(--paper-2); border-color: var(--ink); }
.btn:active:not(:disabled) { background: var(--rule); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { border-radius: 5px 3px 6px 3px / 3px 6px 3px 5px; background: var(--grease); border-color: var(--grease); color: #fff; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: var(--grease-dark); border-color: var(--grease-dark); }
.btn.link { border-color: transparent; padding: 2px 4px; min-height: 0; text-decoration: underline; text-underline-offset: 2px; }
.btn.danger { color: var(--fail); border-color: var(--fail); }
.btn.danger:hover:not(:disabled) { background: var(--fail-bg); border-color: var(--fail); }
label.field { display: block; }
label.field > span { display: block; font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=number], select, textarea { min-height: 36px; padding: 6px 10px; border: 1px solid var(--ink-3); border-radius: 3px; background: #fff; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--grease); outline-offset: 0; border-color: var(--grease); }
input::placeholder { color: var(--ink-3); }
textarea { font-family: var(--mono); font-size: .85rem; line-height: 1.45; }
.inline-form { display: flex; gap: 8px; align-items: stretch; }
.inline-form input { flex: 1; min-width: 0; }

.err { display: flex; gap: 8px; color: var(--fail); background: var(--fail-bg); padding: 9px 12px; border: 1px solid var(--fail); border-radius: 3px; }
.note { background: var(--paper-2); padding: 10px 12px; border-radius: 3px; }
.tick { flex: none; width: 15px; height: 15px; margin-top: 3px; }

/* a strip of film: frames butt together, the paper shows between cut strips */
.strip { display: grid; gap: 22px 0; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); }
.strip.small { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.frame { position: relative; display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; }
.film { position: relative; display: block; background: var(--film); padding: 15px 4px; }
.film::before, .film::after { content: ""; position: absolute; left: 0; right: 0; height: 9px; background-image: linear-gradient(90deg, transparent 5px, var(--paper) 5px, var(--paper) 12px, transparent 12px); background-size: 17px 6px; background-repeat: repeat-x; background-position: 0 center; opacity: .92; }
.film::before { top: 3px; } .film::after { bottom: 3px; }
.film img { display: block; width: 100%; aspect-ratio: 4 / 3; image-rendering: pixelated; background: var(--film-2); }
.small .film { padding: 11px 2px; }
.small .film::before { top: 1px; } .small .film::after { bottom: 1px; }
.small .film::before, .small .film::after { background-size: 12px 5px; background-image: linear-gradient(90deg, transparent 3px, var(--paper) 3px, var(--paper) 8px, transparent 8px); }
.edge { position: absolute; right: 7px; bottom: 16px; font: 10px/1 var(--mono); color: var(--edge); text-shadow: 0 0 2px #000, 0 0 2px #000; pointer-events: none; }
.frame.pending img { filter: brightness(.2) contrast(.7) sepia(.5); }
.frame.active img { filter: brightness(.34) contrast(.8) sepia(.7); animation: safelight 2.4s ease-in-out infinite; }
@keyframes safelight { 50% { filter: brightness(.5) contrast(.85) sepia(.8); } }
.frame.develop img { animation: develop 1.8s var(--ease); }
@keyframes develop { from { filter: brightness(.2) contrast(.7) sepia(.5); } }
.frame.failed img { filter: grayscale(1) brightness(.45); }
.frame.selected .film { box-shadow: inset 0 0 0 2px var(--edge); }
.frame:hover:not(.selected) .film img { outline: 1px solid var(--edge); }
.mark { position: absolute; inset: 3px -3px; width: calc(100% + 6px); height: calc(100% - 6px); overflow: visible; pointer-events: none; z-index: 1; }
.mark path { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.mark.pick path { stroke: var(--grease); stroke-width: 3.5px; }
.mark.alt path { stroke: var(--wax); stroke-width: 2.5px; }
.mark.cross path { stroke: var(--grease); stroke-width: 3px; }
.cap { display: block; padding: 8px 10px 0 2px; }
.cap b { display: block; font-weight: 600; line-height: 1.25; font-size: .9rem; }
.scores { display: flex; gap: 10px; margin-top: 3px; font-size: .84rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scores b { display: inline; font-size: inherit; color: var(--ink); }
.tag { display: inline-block; margin-top: 3px; font-size: .78rem; color: var(--wax-ink); font-weight: 600; }
.pickword { display: block; width: 44px; height: 14px; margin-bottom: 3px; }
.pickword path { fill: none; stroke: var(--grease); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* home */
.intro { display: flex; align-items: flex-start; gap: 24px; justify-content: space-between; margin-bottom: 30px; flex-wrap: wrap; }
.intro p { margin-top: 6px; }
.row { display: block; text-decoration: none; padding: 16px 0 22px; border-top: 1px solid var(--rule); }
.row:hover h2 { text-decoration: underline; text-underline-offset: 3px; }
.rowhead { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr) auto; gap: 4px 18px; margin-bottom: 10px; align-items: baseline; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: .87rem; color: var(--ink-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.status.running .dot { background: var(--edge); box-shadow: 0 0 0 3px oklch(82% .13 78 / .3); animation: breathe 2.4s ease-in-out infinite; }
.status.running { color: var(--ink); }
.status.failed { color: var(--fail); font-weight: 600; } .status.failed .dot { background: var(--fail); }
.status.finished .dot { background: var(--ink); }
.status.weak { color: var(--fail); font-weight: 600; } .status.weak .dot { background: var(--fail); }
.status.partial { color: var(--ink); font-weight: 600; } .status.partial .dot { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); border: 1.5px solid var(--ink); }
.status.stopped .dot { background: transparent; border: 1.5px solid var(--ink-3); }
@keyframes breathe { 50% { box-shadow: 0 0 0 6px oklch(82% .13 78 / .12); } }
.placeholder { background: var(--film); height: 118px; opacity: .13; margin: 18px 0; }

/* dataset page */
.crumb { display: inline-flex; align-items: center; gap: 6px; font-size: .87rem; color: var(--ink-2); text-decoration: none; margin-bottom: 14px; }
.crumb:hover { color: var(--ink); text-decoration: underline; }
.crumb svg { width: 12px; height: 12px; }
.pagehead { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.pagehead .meta { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.verdict { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 48px; padding-bottom: 26px; align-items: start; }
.verdict h1 { font-size: 2rem; }
.verdict p { margin-top: 8px; font-size: 1.03rem; }
.scale { position: relative; height: 22px; margin: 8px 0 6px; }
.scale .line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--rule); }
.scale .span { position: absolute; top: 10px; height: 2px; background: var(--ink-3); }
.scale .ci { position: absolute; top: 7px; height: 8px; background: oklch(54% .205 28 / .28); }
.scale i { position: absolute; top: 3px; width: 2px; height: 16px; background: var(--ink-3); margin-left: -1px; }
.scale i.this { background: var(--grease); width: 4px; margin-left: -2px; top: 1px; height: 20px; }
.legend { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; margin-bottom: 6px; font-size: .82rem; line-height: 1.3; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.legend > :nth-child(2) { text-align: center; } .legend > :last-child { text-align: right; }
.legend b { color: var(--ink); font-weight: 600; }
.legend .t { color: var(--grease-dark); }
.sentence { font-size: .92rem; }
.limits { font-size: .88rem; }
.limits ul { margin: 4px 0 0; padding-left: 18px; color: var(--ink-2); }

.stages { display: flex; margin: 0 0 22px; padding: 0; list-style: none; background: var(--film); color: oklch(68% .01 80); font-size: .8rem; line-height: 1.25; }
.stages li { flex: 1; padding: 9px 10px; border-right: 1px solid var(--film-2); min-width: 0; }
.stages li:last-child { border-right: 0; }
.stages .done { color: oklch(88% .01 80); }
.stages .active { background: var(--edge); color: var(--film); font-weight: 600; }
.stages .halted { background: var(--fail); color: #fff; font-weight: 600; }
.stages .skipped { text-decoration: line-through; }
.stages small { display: block; font: 10px/1.3 var(--mono); opacity: .85; margin-top: 2px; }
.stagehead { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }

.lay { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0 36px; align-items: start; }
.lay > .sheetcol { grid-column: 1; grid-row: 1; } .lay > .restcol { grid-column: 1; grid-row: 2; } .lay > .loupe { grid-column: 2; grid-row: 1 / span 2; }
.loupe { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding: 16px; background: #fff; border: 1px solid var(--rule); border-radius: 3px; box-shadow: 0 8px 26px -14px oklch(21% .008 260 / .35); }
.final { margin-top: 10px; padding: 10px 12px; background: var(--paper-2); border-radius: 3px; font-size: .92rem; }
.loupe h2 { margin: 10px 0 2px; }
.illus { font-size: .8rem; color: var(--ink-2); margin-top: 5px; }
.block { margin-top: 18px; }
.block > h3 { margin-bottom: 4px; }
details { margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 8px; }
summary { cursor: pointer; font-weight: 600; font-size: .92rem; }
summary:hover { text-decoration: underline; text-underline-offset: 2px; }
table { width: 100%; border-collapse: collapse; font-size: .86rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; padding: 5px 8px 5px 0; border-bottom: 1px solid var(--ink-3); vertical-align: bottom; }
td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.n, th.n { text-align: right; padding-right: 0; white-space: nowrap; }
pre { font: .78rem/1.5 var(--mono); overflow: auto; margin: 8px 0 0; }
pre.log { background: var(--film); color: oklch(88% .01 80); padding: 12px; max-height: 420px; white-space: pre-wrap; word-break: break-word; }

.section { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--rule); }
.section > p { margin: 4px 0 12px; }
.mapwrap { max-width: 640px; }
.map text { font: 11px var(--sans); fill: var(--ink-2); }
.map .lab { fill: var(--ink); font-weight: 600; }
.map .pt { cursor: pointer; }
.map .pt circle { fill: var(--ink-3); transition: r .15s var(--ease); }
.map .pt.front circle { fill: var(--ink); }
.map .pt.pick circle { fill: var(--grease); }
.map .pt.sel circle { stroke: var(--edge); stroke-width: 3; }
.map .pt:focus-visible { outline: none; } .map .pt:focus-visible circle { stroke: var(--grease); stroke-width: 3; }
.heat td.c { text-align: center; width: 88px; font-variant-numeric: tabular-nums; border-left: 2px solid var(--paper); border-bottom: 2px solid var(--paper); padding: 6px 4px; }
.heat th.c { text-align: center; padding: 5px 4px; }
.checks { list-style: none; margin: 8px 0 0; padding: 0; }
.checks li { display: flex; gap: 8px; padding: 5px 0; font-size: .9rem; }
.checks li.bad { color: var(--fail); font-weight: 600; }

/* forms and pages */
.steps { display: grid; gap: 0; max-width: 860px; }
.step { padding: 20px 0 24px; border-top: 1px solid var(--rule); }
.step.off { opacity: .45; pointer-events: none; }
.step > h2 { margin-bottom: 4px; }
.step > p { margin-bottom: 12px; }
.choices { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choice { display: block; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; cursor: pointer; text-align: left; transition: border-color .15s; }
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice:disabled { opacity: .55; cursor: not-allowed; }
.choice[aria-pressed=true] { border-color: var(--grease); box-shadow: inset 0 0 0 1px var(--grease); }
.choice b { display: block; }
.choice span { display: block; font-size: .85rem; color: var(--ink-2); }
.browser { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.browser button { padding: 3px 9px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; cursor: pointer; font-size: .86rem; }
.browser button:hover { border-color: var(--ink); }
.pathline { background: var(--film); color: oklch(92% .01 80); padding: 18px 14px; border-radius: 2px; font: 1rem/2.1 var(--mono); overflow-x: auto; white-space: nowrap; }
.tok { border: 0; border-bottom: 2px dashed oklch(70% .01 80); background: none; padding: 1px 3px; margin: 0 1px; cursor: pointer; color: inherit; font: inherit; }
.tok:hover { background: var(--film-2); }
.tok.keep { background: oklch(92% .01 80); color: var(--film); border-bottom-color: transparent; font-weight: 600; }
.tok.hide { outline: 2.5px solid var(--grease); outline-offset: 1px; border-radius: 50% / 40%; border-bottom-color: transparent; font-weight: 600; }
.tok.recording, .tok.scene { background: var(--wax); color: var(--film); border-bottom-color: transparent; font-weight: 600; }
.sep { color: oklch(62% .01 80); }
.pens { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px; margin: 12px 0; }
.marks { display: grid; gap: 8px; margin-top: 12px; }
.markrow { display: grid; grid-template-columns: 130px 170px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.good { color: var(--ink); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.check { display: flex; align-items: flex-start; gap: 8px; font-weight: 400; }
.check input { margin-top: 4px; accent-color: var(--grease); }
.vm { padding: 0 0 26px; }
.vmhead { position: relative; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; background: var(--film); color: oklch(95% .01 80); padding: 17px 14px; }
.vmhead::before, .vmhead::after { content: ""; position: absolute; left: 0; right: 0; height: 8px; background-image: linear-gradient(90deg, transparent 5px, var(--paper) 5px, var(--paper) 12px, transparent 12px); background-size: 17px 5px; background-repeat: repeat-x; background-position: 0 center; }
.vmhead::before { top: 3px; } .vmhead::after { bottom: 3px; }
.edgetext { font: 11px/1 var(--mono); color: var(--edge); }
.vmgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 26px; margin-top: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.empty { padding: 26px 0; max-width: 62ch; }
.empty p { margin: 6px 0 14px; }

@media (max-width: 1040px) { .lay { grid-template-columns: minmax(0, 1fr); } .lay > .sheetcol, .lay > .loupe, .lay > .restcol { grid-column: 1; grid-row: auto; } .lay > .loupe { margin-top: 24px; } .loupe { position: static; max-height: none; } .verdict { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 720px) {
  .rowhead { grid-template-columns: minmax(0, 1fr); }
  main { padding: 20px 16px 56px; } .top { padding: 10px 16px; gap: 12px; } .top nav { gap: 12px; } .top .btn { padding: 6px 10px; }
  .choice, .btn { min-height: 44px; }
  .verdict h1 { font-size: 1.55rem; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip.small { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .strip.small .frame:nth-child(n+4) { display: none; }
  .stages { flex-direction: column; } .stages li { border-right: 0; border-bottom: 1px solid var(--film-2); }
  .markrow { grid-template-columns: 1fr 1fr; } .markrow .dim { grid-column: 1 / -1; }
  .heat { display: block; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">privharness</a>
  <nav aria-label="Main">
    <a href="#/" data-nav="home">Datasets</a>
    <a href="#/vms" data-nav="vms">VMs</a>
  </nav>
  <a class="btn primary" href="#/new">Test a dataset</a>
</header>
<main id="main" tabindex="-1"></main>
<script>
"use strict";
/* ---------- DOM helpers: all data goes in as text nodes, never as HTML ---------- */
const NS = "http://www.w3.org/2000/svg";
function h(tag, attrs, ...kids) {
  const svg = tag.startsWith("svg:");
  const el = svg ? document.createElementNS(NS, tag.slice(4)) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value" && !svg) el.value = v;
    else if (k === "checked" || k === "disabled" || k === "open") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(9)) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: "The UI server sent an unreadable answer." }));
  if (!r.ok) throw new Error(j.error || "Something went wrong.");
  return j;
}
const pct = (v, d = 1) => v === null || v === undefined ? "n/a" : Number(v).toFixed(d);
const of100 = v => v === null || v === undefined ? "n/a" : String(clamp(Math.round(v * 100)));
const clamp = (v, a = 0, b = 100) => Math.max(a, Math.min(b, v));
const icon = {
  back: () => h("svg:svg", { viewBox: "0 0 12 12", "aria-hidden": "true" }, h("svg:path", { d: "M7.5 1.5 3 6l4.5 4.5", fill: "none", stroke: "currentColor", "stroke-width": "1.6", "stroke-linecap": "round", "stroke-linejoin": "round" })),
  ok: () => h("svg:svg", { class: "tick", viewBox: "0 0 15 15", "aria-label": "Passed" }, h("svg:path", { d: "M2.5 8 6 11.5 12.5 3.5", fill: "none", stroke: "currentColor", "stroke-width": "1.8", "stroke-linecap": "round", "stroke-linejoin": "round" })),
  warn: () => h("svg:svg", { class: "tick", viewBox: "0 0 15 15", "aria-label": "Worth checking" }, h("svg:path", { d: "M7.5 2.5v6.5M7.5 11.8v.4", fill: "none", stroke: "currentColor", "stroke-width": "1.9", "stroke-linecap": "round" })),
  bad: () => h("svg:svg", { class: "tick", viewBox: "0 0 15 15", "aria-label": "Failed" }, h("svg:path", { d: "M3 3l9 9M12 3l-9 9", fill: "none", stroke: "currentColor", "stroke-width": "1.8", "stroke-linecap": "round" })),

      ready && w.source === "prepared" ? h("section", { class: "step" }, h("h2", {}, "Which one?"), h("div", { class: "choices" }, (S.state?.adapters || []).map(a => h("button", { type: "button", class: "choice", disabled: !probe.data?.[a], "aria-pressed": String(w.adapt === a), onclick: () => set({ adapt: a, name: w.name || (a === "kth" ? `kth-${w.split}` : a.replace(/_/g, "-")) }) }, h("b", {}, a), h("span", {}, probe.data?.[a] ? "On this VM" : "Not on this VM. See scripts/download_data.sh")))),

/* ---------- Refresh loop ---------- */
async function poll() {
  try {
    const st = await api("/api/state"), js = JSON.stringify(st), changed = js !== S.stateJSON;
    S.state = st; S.stateJSON = js;
    const r = route();
    // the forms re-render only when the VM list itself changes, so typing is never interrupted
    if (changed && (r.page === "home" || r.page === "vms")) render();
    if (changed && r.page === "new" && JSON.stringify(st.hosts.map(x => [x.host, !!x.probe, x.error, vmReady(x)])) !== S.wizKey) { S.wizKey = JSON.stringify(st.hosts.map(x => [x.host, !!x.probe, x.error, vmReady(x)])); render(); }
  } catch (e) { /* the next tick retries; the server may be restarting */ }
}
window.addEventListener("hashchange", () => { S.log = null; render(false); window.scrollTo(0, 0); refreshRun(); });
render(false); poll().then(() => render()); refreshRun();
setInterval(poll, 5000);
setInterval(() => { const r = route(); if (r.page === "sheet" && S.run && S.run.host !== "local") refreshRun(); }, 5000);
