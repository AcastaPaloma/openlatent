[project]
name = "openlatent"
version = "0.1.0"
description = "Deterministic privacy and utility scoring for raw inputs and learned latents"
authors = [
    { name = "Kuan Yi Wang", email = "kuanyi.wang0807@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
openlatent = "openlatent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
